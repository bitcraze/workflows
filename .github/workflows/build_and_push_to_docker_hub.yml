# Build a docker image from a git tag.
# Push the image to docker hub, both as latest and a tag

name: Build a docker image and push to docker Hub

on:
  workflow_call:
    inputs:
      # The full name of the image
      image:
        required: true
        type: string
    secrets:
      # Docker hub username
      username:
        required: true
      # Docker hub password
      password:
        required: true

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ inputs.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./src
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ inputs.image }}:latest
